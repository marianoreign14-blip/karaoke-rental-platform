services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: karaokewebapp
      POSTGRES_USER: karaokewebapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - karaokewebapp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaokewebapp -d karaokewebapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  karaokewebapp-data:
