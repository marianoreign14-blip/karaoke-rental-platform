services:
  - type: web
    name: karaoke-marketplace-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/live
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://karaoke-marketplace.onrender.com"]'
      - key: APP_BASE_URL
        value: https://karaoke-marketplace.onrender.com

  - type: web
    name: karaoke-marketplace
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./www
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
    routes:
      - type: rewrite
        source: /api
        destination: https://karaoke-marketplace-api.onrender.com/api
      - type: rewrite
        source: /api/*
        destination: https://karaoke-marketplace-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
