<ion-header>
  <header class="topbar">
    <a class="brand" routerLink="/home" aria-label="KARAOKE home">
      <app-brand-mark></app-brand-mark>
    </a>
    <app-responsive-menu>
      <nav><a routerLink="/home">Marketplace</a><a routerLink="/account">Sign in</a></nav>
    </app-responsive-menu>
  </header>
</ion-header>

<ion-content>
  <main>
    <section class="panel">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Forgot your password?</h1>
      <p class="intro">Enter your account email address to request a one-time password reset token.</p>

      @if (error) {
      <p class="error" role="alert">{{ error }}</p>
      } @if (notice) {
      <p class="notice" role="status">{{ notice }}</p>
      }

      <form (ngSubmit)="submit()" novalidate>
        <label>
          <span>Email address <span class="required-mark" aria-hidden="true">*</span></span>
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            autocomplete="email"
            autocapitalize="off"
            placeholder="you@example.com"
            [attr.aria-invalid]="emailError ? 'true' : null"
            maxlength="320"
            required
          />
          @if (emailError) {
          <span class="field-error" role="alert">{{ emailError }}</span>
          }
        </label>
        <button type="submit" [disabled]="saving">{{ saving ? 'Submitting…' : 'Request password reset' }}</button>
      </form>

      <div class="links">
        <a routerLink="/reset-password">Already have a reset token? Reset password →</a>
        <a routerLink="/account">← Back to sign in</a>
      </div>
    </section>
  </main>
</ion-content>
