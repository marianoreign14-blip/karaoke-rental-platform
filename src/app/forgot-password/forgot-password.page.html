<ion-header>
  <header class="topbar">
    <a class="brand" routerLink="/home">KARAOKE</a>
    <nav><a routerLink="/home">Marketplace</a><a routerLink="/account">Sign in</a></nav>
  </header>
</ion-header>

<ion-content>
  <main>
    <section class="panel">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Forgot your password?</h1>
      <p class="intro">Enter your account email address to request a one-time password reset token.</p>

      @if (error) {
      <p class="error" role="alert">{{ error }}</p>
      } @if (notice) {
      <p class="notice" role="status">{{ notice }}</p>
      }

      <form (ngSubmit)="submit()">
        <label>
          Email address
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            autocomplete="email"
            autocapitalize="off"
            placeholder="you@example.com"
            maxlength="320"
            required
          />
        </label>
        <button type="submit" [disabled]="saving">{{ saving ? 'Submitting…' : 'Request password reset' }}</button>
      </form>

      <div class="links">
        <a routerLink="/reset-password">Already have a reset token? Reset password →</a>
        <a routerLink="/account">← Back to sign in</a>
      </div>
    </section>
  </main>
</ion-content>
